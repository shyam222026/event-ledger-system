version: "3.9"
services:
  event-gateway:
    build:
      context: ./event-gateway
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
  account-service:
    build:
      context: ./account-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
